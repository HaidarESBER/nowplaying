<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Now Playing architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">A static page served by GitHub Pages. All logic runs in the browser; no server of its own.</text>

  <!-- browser -->
  <rect x="270" y="86" width="420" height="320" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Browser on the phone / tablet</text>

  <rect x="296" y="126" width="368" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="480" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">index.html + style.css</text>
  <text x="480" y="166" text-anchor="middle" font-size="11" fill="#475569">layouts per orientation, lyrics on/off</text>

  <rect x="296" y="190" width="368" height="100" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="480" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">app.js</text>
  <text x="480" y="232" text-anchor="middle" font-size="11" fill="#475569">PKCE login + token refresh</text>
  <text x="480" y="249" text-anchor="middle" font-size="11" fill="#475569">poll player state, interpolate progress</text>
  <text x="480" y="266" text-anchor="middle" font-size="11" fill="#475569">fetch + parse LRC lyrics, Screen Wake Lock</text>

  <rect x="296" y="304" width="368" height="44" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="480" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">localStorage</text>
  <text x="480" y="339" text-anchor="middle" font-size="11" fill="#475569">Client ID and tokens stay in this browser</text>

  <text x="480" y="378" text-anchor="middle" font-size="11" fill="#64748b">manifest.webmanifest: installable to the home screen</text>
  <text x="480" y="394" text-anchor="middle" font-size="11" fill="#64748b">?demo mode uses fake songs, no Spotify account needed</text>

  <!-- GitHub Pages -->
  <rect x="40" y="150" width="170" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="125" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">GitHub Pages</text>
  <text x="125" y="199" text-anchor="middle" font-size="11" fill="#475569">static files</text>
  <line x1="210" y1="185" x2="268" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Spotify -->
  <rect x="750" y="120" width="170" height="86" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="835" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Spotify</text>
  <text x="835" y="168" text-anchor="middle" font-size="11" fill="#475569">accounts: login, token</text>
  <text x="835" y="185" text-anchor="middle" font-size="11" fill="#475569">Web API: player + controls</text>
  <line x1="692" y1="163" x2="748" y2="163" stroke="#64748b" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- LRCLIB -->
  <rect x="750" y="250" width="170" height="70" rx="10" fill="#faf5ff" stroke="#c084fc"/>
  <text x="835" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">LRCLIB</text>
  <text x="835" y="299" text-anchor="middle" font-size="11" fill="#475569">synced lyrics, once per song</text>
  <line x1="692" y1="285" x2="748" y2="285" stroke="#64748b" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
